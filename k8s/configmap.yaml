---
# k8s/configmap.yaml
# Non-sensitive runtime configuration for the AI DevOps Agent.
# Sensitive values (API keys) live in k8s/secret.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-devops-agent-config
  namespace: ai-devops-agent
  labels:
    app.kubernetes.io/name: ai-devops-agent
    app.kubernetes.io/component: config
data:
  # OpenAI model selection
  OPENAI_MODEL: "gpt-4o"

  # FastAPI server
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # In-container data paths (backed by emptyDir volumes in the Deployment)
  MEMORY_DIR: "/app/data/memory"
  ANSIBLE_PRIVATE_DATA_DIR: "/app/data/ansible"
  AUDIT_LOG_PATH: "/app/data/audit.log"
  DOCS_OUTPUT_DIR: "/app/docs/incidents"

  # Memory retrieval
  MAX_MEMORY_RESULTS: "5"

  # Safety: require confirmation before destructive actions
  REQUIRE_CONFIRMATION: "true"

  # RBAC allowed roles
  ALLOWED_ROLES: "admin,operator"
