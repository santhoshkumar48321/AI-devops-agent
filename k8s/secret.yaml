---
# k8s/secret.yaml
# Sensitive configuration values.
#
# BEFORE APPLYING:
#   Replace <base64-encoded-api-key> with the result of:
#     echo -n "sk-your-real-key" | base64
#
# For production use a secrets manager (Vault, Sealed Secrets, etc.)
# instead of committing this file with real values.
apiVersion: v1
kind: Secret
metadata:
  name: ai-devops-agent-secret
  namespace: ai-devops-agent
  labels:
    app.kubernetes.io/name: ai-devops-agent
    app.kubernetes.io/component: secret
type: Opaque
data:
  # echo -n "sk-your-openai-api-key" | base64
  OPENAI_API_KEY: <base64-encoded-api-key>
