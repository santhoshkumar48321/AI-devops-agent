---
# k8s/service.yaml
# Exposes the AI DevOps Agent as a NodePort service so it can be accessed
# from the host machine during testing (http://<node-ip>:30800).
apiVersion: v1
kind: Service
metadata:
  name: ai-devops-agent-svc
  namespace: ai-devops-agent
  labels:
    app.kubernetes.io/name: ai-devops-agent
    app.kubernetes.io/component: service
spec:
  type: NodePort
  selector:
    app: ai-devops-agent
  ports:
    - name: http
      protocol: TCP
      port: 8000          # ClusterIP port (internal)
      targetPort: http    # Named port on the container
      nodePort: 30800     # External port on each Node (30000-32767 range)
